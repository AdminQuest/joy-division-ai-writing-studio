<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents maîtres — Joy Division</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <p class="eyebrow">Joy Division — AI Writing Studio</p>
    <h1>Documents maîtres</h1>
    <p class="subtitle">Consultation pleine page des documents maîtres générés depuis les atomes et registres du repo.</p>
  </div>
  <nav>
    <a href="../../">Portail</a>
    <a href="../rag-studio/">RAG Studio</a>
    <a href="../prompt-studio/">Prompt Studio</a>
  </nav>
</header>
<main>
  <aside>
    <div class="panel-title">Chapitres</div>
    <div id="chapter-list" class="chapter-list"></div>
  </aside>
  <section class="reader">
    <div class="toolbar">
      <div>
        <div id="doc-title" class="doc-title">Sélectionner un document maître</div>
        <div id="doc-meta" class="doc-meta"></div>
      </div>
      <div class="actions">
        <button id="copy-btn">Copier</button>
        <a id="raw-link" href="#" target="_blank" rel="noopener">Markdown brut</a>
      </div>
    </div>
    <article id="content" class="content empty">
      Les documents maîtres apparaissent ici.
    </article>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
