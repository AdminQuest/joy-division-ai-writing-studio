<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafaf7">
  <title>Registre des chansons — Joy Division</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="songs-app">
    <header class="songs-hero" id="list-hero">
      <div class="songs-hero__inner">
        <a class="songs-hero__back" href="../../">← Retour au portail</a>
        <h1>Registre des chansons</h1>
        <p class="songs-hero__subtitle">Le canon des chansons Joy Division / Warsaw, groupé par catégorie : œuvres complètes, corpus Warsaw, démos, inédits, lives précoces et titres terminaux. Agrège variantes, sessions, lives et mentions atomisées.</p>
      </div>
    </header>

    <main class="songs-layout" id="list-view">
      <section class="songs-toolbar" aria-label="Filtres et recherche">
        <div class="songs-toolbar__filters">
          <div class="songs-field">
            <label for="search">Recherche</label>
            <input id="search" type="search" placeholder="Transmission, Warsaw, Peel, RCA, live…" autocomplete="off">
          </div>
          <div class="songs-field">
            <label for="category-filter">Catégorie</label>
            <select id="category-filter"><option value="">Toutes</option></select>
          </div>
          <div class="songs-field">
            <label for="period-filter">Période</label>
            <select id="period-filter"><option value="">Toutes</option></select>
          </div>
          <div class="songs-field">
            <label for="status-filter">Statut</label>
            <select id="status-filter"><option value="">Tous</option></select>
          </div>
          <div class="songs-field">
            <label for="source-filter">Source</label>
            <select id="source-filter"><option value="">Toutes</option></select>
          </div>
          <div class="songs-field">
            <label for="chapter-filter">Chapitre</label>
            <select id="chapter-filter"><option value="">Tous</option></select>
          </div>
        </div>
        <div class="songs-toolbar__actions">
          <button id="reset-filters" class="songs-btn" type="button">Réinitialiser</button>
          <button id="download-csv" class="songs-btn songs-btn--primary" type="button">Exporter CSV</button>
          <span class="songs-toolbar__meta" id="results-meta"></span>
        </div>
      </section>

      <div id="songs-status" class="songs-status">Chargement du corpus canonique…</div>
      <div id="songs-sections"></div>
    </main>

    <!-- Vue de détail (12b-2.c MVP) : remplie et révélée par app.js quand
         l'URL porte ?id=JD-SONG-NNN ou ?slug=…. Masquée sur la vue liste. -->
    <main class="songs-layout song-detail-view" id="detail-view" hidden></main>
  </div>

  <script src="../lib/dynamic-registers.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="local-editor-links.js"></script>
</body>
</html>
