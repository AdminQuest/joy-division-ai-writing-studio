<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — Corpus Joy Division</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1115;color:#f3f3f3;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 28px;border-bottom:1px solid #2a2f38;background:#171b22;gap:20px;flex-wrap:wrap}
.header-left p.eyebrow{margin:0;color:#8d99a8;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em}
header h1{margin:6px 0 8px;font-size:1.9rem}
.subtitle{margin:0;color:#b6c0cb;max-width:780px;line-height:1.5;font-size:.95rem}
header nav{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding-top:4px}
header nav a{color:#d6dde6;text-decoration:none;background:#222834;padding:10px 14px;border-radius:10px;font-size:.9rem;white-space:nowrap}
header nav a:hover{background:#2c3449}
.toolbar{display:flex;gap:12px;align-items:center;padding:14px 28px;background:#13171e;border-bottom:1px solid #1e2430;flex-wrap:wrap}
.toolbar button{background:#1e2430;color:#d0d8e4;border:1px solid #2a3040;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.88rem}
.toolbar button:hover{background:#2a3449}
.toolbar button.active{background:#2c3a52;border-color:#4a6080;color:#a8c8f0}
.status-bar{padding:10px 28px;font-size:.82rem;color:#6e7d8f;background:#0f1115;border-bottom:1px solid #191e27}
#status-msg{display:inline}
.content{padding:30px 28px;flex:1;overflow:auto}
/* Rendered Markdown styles */
.content h1{font-size:1.8rem;color:#e8edf3;border-bottom:1px solid #2a2f38;padding-bottom:.4em;margin:0 0 .8em}
.content h2{font-size:1.4rem;color:#e0e8f0;border-bottom:1px solid #1e2430;padding-bottom:.3em;margin:1.8em 0 .6em}
.content h3{font-size:1.1rem;color:#cdd6e2;margin:1.4em 0 .5em}
.content h4{font-size:.98rem;color:#b0bbc8;margin:1.2em 0 .4em}
.content p{margin:.5em 0;line-height:1.65;color:#d8dfe8}
.content table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.88rem;overflow-x:auto;display:block}
.content th{background:#1e2430;color:#c8d0db;font-weight:600;padding:7px 11px;text-align:left;border:1px solid #2a2f38;white-space:nowrap}
.content td{padding:6px 11px;border:1px solid #1e2430;vertical-align:top;color:#c8d2dc}
.content tr:nth-child(even) td{background:#13171e}
.content tr:hover td{background:#1a2030}
.content code{background:#1a1f28;color:#c8e6c9;padding:2px 5px;border-radius:4px;font-family:ui-monospace,monospace;font-size:.85em}
.content pre{background:#12161d;padding:16px;border-radius:8px;overflow:auto;border:1px solid #2a2f38;margin:1em 0}
.content pre code{background:none;padding:0;color:#d4e6d4}
.content blockquote{border-left:3px solid #4a5568;margin:1em 0;padding:.5em 1em;color:#a0aab4;background:#13171e;border-radius:0 6px 6px 0}
.content ul,.content ol{padding-left:1.5em;margin:.4em 0}
.content li{margin:.2em 0;line-height:1.6;color:#c8d2dc}
.content hr{border:none;border-top:1px solid #2a2f38;margin:2em 0}
.content a{color:#7aa2d4}
.content strong{color:#e0e8f4}
.content em{color:#b8c8d8}
/* Status badge coloring in tables */
.content td:has(.badge-atomisee){color:#6fcf97}
.badge-atomisee{color:#6fcf97;font-weight:600}
.badge-en_cours{color:#f2c94c;font-weight:600}
.badge-a_atomiser{color:#eb5757;font-weight:600}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:#6e7d8f;font-size:1.1rem}
@media(max-width:800px){header{flex-direction:column}.content table{font-size:.78rem}}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <p class="eyebrow">Joy Division — AI Writing Studio</p>
    <h1>📊 Tableau de bord — Corpus</h1>
    <p class="subtitle">État des atomisations, couverture des chapitres et registres du corpus de recherche.</p>
  </div>
  <nav>
    <a href="../../">← Accueil</a>
    <a href="../concept-register/">Registre des concepts</a>
    <a href="../chronology-register/">Chronologie</a>
  </nav>
</header>

<div class="toolbar">
  <button id="btn-refresh" onclick="loadDashboard()">↺ Actualiser</button>
  <button id="btn-raw" onclick="openRaw()">Markdown brut</button>
</div>

<div class="status-bar"><span id="status-msg">Chargement du tableau de bord…</span></div>

<div class="content" id="content">
  <div class="loading">Chargement en cours…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const REPO = 'AdminQuest/joy-division-ai-writing-studio';
const BRANCH = 'main';
const FILE = 'reports/atomisation/tableau_de_bord.md';
const RAW_URL = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${FILE}`;

marked.setOptions({
  breaks: false,
  gfm: true,
  headerIds: true
});

function openRaw() {
  window.open(`https://github.com/${REPO}/blob/${BRANCH}/${FILE}`, '_blank');
}

function colorizeStatusBadges(html) {
  // Colorize status cells in tables
  html = html.replace(/\batomisee\b/g, '<span class="badge-atomisee">atomisee</span>');
  html = html.replace(/\ben_cours\b/g, '<span class="badge-en_cours">en_cours</span>');
  html = html.replace(/\ba_atomiser\b/g, '<span class="badge-a_atomiser">a_atomiser</span>');
  return html;
}

async function loadDashboard() {
  const content = document.getElementById('content');
  const statusMsg = document.getElementById('status-msg');
  statusMsg.textContent = 'Chargement depuis GitHub…';
  content.innerHTML = '<div class="loading">Chargement en cours…</div>';

  try {
    const res = await fetch(RAW_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();

    // Extract generated date from frontmatter comment or first line
    const dateMatch = md.match(/généré.*?(\d{4}-\d{2}-\d{2})/i);
    const genDate = dateMatch ? dateMatch[1] : '';

    let html = marked.parse(md);
    html = colorizeStatusBadges(html);
    content.innerHTML = html;

    const info = genDate ? ` — généré le ${genDate}` : '';
    statusMsg.textContent = `Tableau de bord chargé${info}`;
  } catch (err) {
    content.innerHTML = `<p style="color:#eb5757">Erreur de chargement : ${err.message}</p>
      <p style="color:#8d99a8">Vérifiez que le repo public est accessible et que le fichier <code>${FILE}</code> existe sur la branche <code>${BRANCH}</code>.</p>`;
    statusMsg.textContent = 'Erreur de chargement';
    console.error(err);
  }
}

loadDashboard();
</script>
</body>
</html>
