<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joy Division — RAG Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>Joy Division — RAG Studio</h1>
      <p class="subtitle">
        Interface documentaire web · RAG lexical · Corpus structuré
      </p>
      <p class="back"><a href="/">← Retour au portail</a></p>
    </div>
  </header>

  <main class="layout">
    <section class="search-panel">
      <form id="search-form">
        <label for="query">Recherche documentaire</label>
        <textarea
          id="query"
          name="query"
          rows="3"
          placeholder="Exemple : Hannett live sound Unknown Pleasures"
          required
        ></textarea>

        <div class="controls">
          <div class="field">
            <label for="kind">Type documentaire</label>
            <select id="kind" name="kind">
              <option value="">Tous</option>
              <option value="atom">Atomes</option>
              <option value="quote">Citations</option>
              <option value="chronology">Chronologie</option>
              <option value="song">Chansons</option>
              <option value="person">Personnes</option>
            </select>
          </div>

          <div class="field">
            <label for="top">Résultats</label>
            <select id="top" name="top">
              <option>5</option>
              <option selected>10</option>
              <option>15</option>
              <option>20</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="submit">Interroger le corpus</button>
        </div>
      </form>

      <section class="sources-browser">
        <div class="panel-heading">
          <h2>Sources atomisées</h2>
          <span id="sources-count"></span>
        </div>
        <p class="panel-note">Ouvrir une source affiche ses atomes, citations, entrées chronologiques et autres enregistrements liés.</p>
        <div id="sources-list"></div>
      </section>

      <section class="examples">
        <h2>Exemples</h2>

        <button class="example-query" data-query="Ian Curtis epilepsy domestic life">
          Ian Curtis epilepsy domestic life
        </button>

        <button class="example-query" data-query="Hannett live sound studio frustration">
          Hannett live sound studio frustration
        </button>

        <button class="example-query" data-query="Transmission first real Joy Division song">
          Transmission first real Joy Division song
        </button>

        <button class="example-query" data-query="Rob Gretton Factory management">
          Rob Gretton Factory management
        </button>
      </section>
    </section>

    <section class="results-panel">
      <div class="status-card" id="status-card">
        Chargement du corpus…
      </div>

      <div class="results-header">
        <h2 id="results-title">Résultats</h2>
        <div id="results-meta"></div>
      </div>

      <div id="results"></div>
    </section>
  </main>

  <template id="result-template">
    <article class="result-card">
      <div class="result-topline">
        <span class="result-kind"></span>
        <span class="result-score"></span>
      </div>

      <h3 class="result-title"></h3>

      <div class="result-file"></div>

      <dl class="result-fields"></dl>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
