schema: atom
version: 2.1

description: >
  Schéma documentaire enrichi des unités atomiques.
  Chaque atome constitue désormais une unité documentaire,
  argumentative et relationnelle exploitable par le RAG,
  les diagnostics historiographiques et les graphes documentaires.

required:
  - id
  - source_id
  - auteur
  - titre
  - type_unite
  - concepts
  - chapitres
  - statut
  - fiabilite
  - role_argumentatif
  - niveau_preuve
  - stabilite
  - importance
  - risque_surinterpretation
  - liens_interchapitres
  - liens_citations
  - motifs
  - concepts_derives

recommended:
  - relations
  - couche_narrative
  - charge_emotionnelle
  - nature_discursive
  - usages_redactionnels
  - contradictions
  - limites_usage
  - legacy_id

controlled_values:

  # Valeurs autorisées pour type_unite. Miroir documentaire de la liste
  # *appliquée* par tools/schema_validation.py (SCHEMA_CONTROLLED_VALUES). Toute
  # modification doit être répercutée des deux côtés. Ajouts D.6 (étape 2) :
  # prudence_methodologique, reference_croisee.
  type_unite:
    - fait
    - lecture
    - concept
    - citation_clef
    - mythe
    - controverse
    - biographie
    - production
    - concert
    - reception
    - memoire
    - santé
    - relation
    - politique
    - esthétique
    - archive
    - sociologie
    - analyse
    - psychologie_sociale
    - culture_musicale
    - domesticité
    - prudence_methodologique
    - reference_croisee

  couche_narrative:
    - historique
    - analytique
    - theorique
    - memorielle
    - sensible
    - quasi_litteraire

  relation_types:
    - soutient
    - nuance
    - contredit
    - complète
    - illustre
    - derive_de
    - prolonge
    - réinterprète
    - theorise
    - mythologise
    - corrige
    - reconstruit
    - simplifie
    - témoigne
    - se_souvient
    - reformule

rules:
  - les relations doivent toujours pointer vers un identifiant existant
  - les relations historiographiques doivent être distinguées des relations factuelles
  - les couches narratives doivent rester équilibrées à l’échelle d’un chapitre
  - les relations de type mythologise doivent être utilisées explicitement
