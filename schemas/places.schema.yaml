# JSON Schema (Draft 2020-12) du registre des lieux.
#
# Contrairement aux autres *.schema.yaml du dossier (normes documentaires
# lisibles), ce fichier est un schéma JSON formel, destiné à une validation
# programmatique (tools/validate_places.py, FormatChecker actif).
#
# Convention d'identifiant :
#   - PLACE-*  : un lieu réel (validé par ce schéma).
#   - PLACES-* : un en-tête de document (type_unite: registre_lieux) — ce
#                n'est PAS un lieu et il est explicitement rejeté ci-dessous.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://joy-division.local/schemas/places.schema.yaml"
title: "Registre des lieux — Joy Division"
description: >
  Schéma d'un lieu documentaire (ville, quartier, logement, studio, salle,
  commerce, lieu d'éducation, de santé, industriel ou de mémoire) du corpus
  Joy Division.
type: object

# ── Champs requis ────────────────────────────────────────────────
required:
  - id
  - label
  - type

# ── Rejet explicite des en-têtes de document ─────────────────────
# Un enregistrement porteur de type_unite n'est un lieu que si
# type_unite == "place". Les en-têtes (type_unite: registre_lieux) sont
# rejetés.
if:
  required: [type_unite]
then:
  properties:
    type_unite:
      const: place

# ── Propriétés ───────────────────────────────────────────────────
properties:

  id:
    type: string
    description: "Identifiant canonique du lieu."
    pattern: "^PLACE-[A-Z0-9][A-Z0-9-]*$"

  label:
    type: string
    description: "Libellé affiché du lieu."
    minLength: 1

  type:
    type: string
    description: "Famille canonique du lieu."
    enum:
      - ville           # échelles urbaines : ville, municipalité, comté, centralité
      - quartier        # quartiers, rues, axes urbains
      - habitat         # estates, tower blocks, suburbs, cités, domiciles
      - studio          # studios, espaces de répétition / production
      - salle           # salles de concert, clubs, youth clubs
      - commerce        # disquaires, librairies, grands magasins, hubs marchands
      - education       # écoles, universités
      - sante           # hôpitaux, lieux de soin
      - industrie       # sites industriels, usines, manufactures
      - science         # observatoires, sites scientifiques
      - infrastructure  # gares, ponts, seuils ferroviaires, réseaux
      - pouvoir         # commissariats, institutions d'ordre public
      - lieu_memoire    # lieux symboliques, de témoignage, de projection, sites historiques

  type_detail:
    type: string
    description: >
      Valeur fine d'origine (ex. quartier_inner_city, estate_moderniste,
      disquaire_hub_punk). Préserve la nuance absorbée par la famille `type`.

  sources:
    type: array
    description: "Références sources (S02, S05-A003, S35…)."
    items:
      type: string
      minLength: 1

  source_id:
    type: string
    description: "Source unique (legacy ; préférer `sources`)."

  source_label:
    type: string
    description: "Libellé long de la source."

  usage:
    type: string
    description: "Champ canonique d'usage / fonction documentaire du lieu."

  # ── Variantes d'usage héritées (tolérées en transition) ────────
  usage_s02:
    type: string
    deprecated: true
    description: "Hérité — fusionné dans `usage` côté rendu."
  usage_s05:
    type: string
    deprecated: true
    description: "Hérité — fusionné dans `usage` côté rendu."
  usage_s06:
    type: string
    deprecated: true
    description: "Hérité — fusionné dans `usage` côté rendu."
  usage_s10:
    type: string
    deprecated: true
    description: "Hérité — fusionné dans `usage` côté rendu."
  usage_s20:
    type: string
    deprecated: true
    description: "Hérité — fusionné dans `usage` côté rendu."

  prudence:
    type: string
    description: "Avertissement méthodologique / précaution d'usage."

  chapitres:
    type: array
    description: >
      Chapitres du manuscrit où le lieu intervient. Forme canonique
      "Chapitre N" (chaînes uniquement) — les entiers nus sont rejetés.
    items:
      type: string

  atoms:
    type: array
    description: "Références vers les atomes documentaires (S35-A033…)."
    items:
      type: string

  song_ids:
    type: array
    description: "Liens croisés vers le registre des chansons (JD-SONG-035…)."
    items:
      type: string

  lat:
    type: number
    minimum: -90
    maximum: 90
    description: >
      Latitude en degrés décimaux (WGS84). Renseignée par l'étape 12b-1.c
      (carte Leaflet). Curation hors-ligne recoupée Wikidata (propriété P625,
      CC0) ; QID porté par `reference_croisee`, granularité par `geo_precision`.
      Attachée au lieu CANONIQUE (après réconciliation `same_as`), jamais à un
      enregistrement legacy.
  lng:
    type: number
    minimum: -180
    maximum: 180
    description: >
      Longitude en degrés décimaux (WGS84). Mêmes règles que `lat`.

  geo_precision:
    type: string
    description: >
      Granularité de la coordonnée (lat/lng) — échelle ORDINALE, du plus fin au
      plus large : `exacte` (bâtiment / point précis), `rue` (axe ou tronçon),
      `quartier`, `ville` (centroïde). Axe de GRANULARITÉ uniquement :
      l'incertitude ou l'approximation (lieu démoli, localisation douteuse) se
      documente dans `prudence_methodologique`, jamais comme une valeur de
      précision (granularité et confiance sont deux axes distincts).
    enum:
      - exacte
      - rue
      - quartier
      - ville

  same_as:
    type: string
    pattern: "^PLACE-[A-Z0-9][A-Z0-9-]*$"
    description: >
      Arête d'équivalence d'identité inter-registres (cross-ready, étape 5) —
      au sens de owl:sameAs / schema.org/sameAs. MONO-VALUÉE : une seule cible
      canonique par enregistrement (un tableau est refusé — une équivalence vers
      plusieurs canoniques serait contradictoire ; s'ils sont le même lieu ils
      doivent fusionner, sinon ce ne sont pas des équivalents). Portée
      UNIQUEMENT par un enregistrement LEGACY non canonique : pointe vers
      l'identifiant CANONIQUE (forme `PLACE-<SLUG>` source-agnostique) du même
      lieu physique. Append-only : le canonique n'est jamais muté. Le loader
      résout la clôture transitive (union-find) et fusionne sur le point fixe ;
      le validateur impose cible existante (INV-1), absence de cycle (INV-2),
      canonique = point fixe (INV-3), convergence unique (INV-4). Réutilisable
      telle quelle par la spécification cross-registres (étape 5) et les
      croisements concerts (étape 10) / maillage (étape 11).

  reference_croisee:
    type: array
    description: >
      Références d'autorité externes recoupant le lieu, sous forme
      d'identifiants PRÉFIXÉS PAR AUTORITÉ (ex. "wikidata:Q204686",
      "musicbrainz:place:…", "osm:node:…"). Notamment le QID Wikidata source de
      la coordonnée (propriété P625, CC0, stockable sans attribution) :
      provenance vérifiable de la donnée géographique.
    items:
      type: string
      minLength: 1

  prudence_methodologique:
    type: string
    description: >
      Précaution spécifique à la donnée géographique : lieu démoli, coordonnée
      approximative / incertaine, désambiguïsation, QID non encore recoupé.
      Porte l'axe CONFIANCE/incertitude (cf. `geo_precision` = granularité).
      Distincte de `prudence` (précaution documentaire générale, héritée).

  pages_pdf:
    type: [string, integer]
    description: "Provenance : page(s) PDF de la source."
  pages_livre:
    type: [string, integer]
    description: "Provenance : page(s) du livre imprimé."

  statut:
    type: string
    description: "Statut d'intégration (legacy, provenance)."

  type_unite:
    type: string
    description: "Présent uniquement si == 'place' (cf. règle if/then)."

  _legacy_format:
    type: string
    description: >
      Traçabilité : format d'origine avant normalisation
      (ex. 's35-lieux-fonction', 's41-titre-nature').

# ── Strict mais tolérant : liste blanche fermée ──────────────────
additionalProperties: false
