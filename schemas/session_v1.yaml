schema: session
version: 1.0

description: >
  Schéma documentaire des sessions studio, Peel sessions, démos et
  répétitions enregistrées de Joy Division (et Warsaw).
  Source canonique primaire : joydiv.org (Tony Nuttall).
  Régit registers/sessions/00_canonical_sessions.md.

required:
  - id
  - numero
  - label
  - date
  - studio
  - ville
  - producteur
  - ere
  - source

recommended:
  - titres
  - premiere_sortie_officielle
  - atomes_lies
  - chronologie_id
  - notes

optional:
  - ingenieur_son
  - statut_session

# ─── Détail des champs ──────────────────────────────────────────────

fields:

  id:
    type: string
    pattern: "JD-SESSION-YYYYMMDD-NNN"
    description: >
      Identifiant canonique unique. Format : JD-SESSION-YYYYMMDD-NNN.
      Pour sessions au mois sans jour précis, utiliser YYYYMM00
      (ex. JD-SESSION-19771200-001 pour décembre 1977).
      Pour sessions à date entièrement inconnue dans l'année,
      utiliser YYYY0000.
    example: "JD-SESSION-19770718-001"

  numero:
    type: integer
    description: >
      Numéro d'ordre dans la chronologie canonique des sessions
      (1 à 17 dans le registre joydiv.org). Permet de retrouver
      rapidement la session par son rang historique.
    example: 1

  label:
    type: string
    description: >
      Libellé court et reconnaissable de la session
      (ex. "Warsaw demo", "Unknown Pleasures sessions",
      "John Peel Session 1", "Closer sessions").
    example: "Warsaw demo"

  date:
    type: string
    format: "YYYY-MM-DD"
    description: >
      Date ISO 8601 de début de session. Si mois seulement, YYYY-MM-00.
      Pour une plage (ex. 3-4 mai 1978), utiliser la date de début et
      préciser la plage dans notes.
    example: "1977-07-18"

  studio:
    type: string
    description: "Nom canonique du studio."
    example: "Pennine Sound Studios"

  ville:
    type: string
    example: "Oldham"

  producteur:
    type: string
    description: >
      Nom du ou des producteurs. "Inconnu" si non documenté.
      Plusieurs producteurs séparés par des virgules.
    example: "Martin Hannett"

  ere:
    type: string
    description: "Nom du groupe à la date de la session."
    controlled_values:
      - "Warsaw"
      - "Joy Division"

  source:
    type: string
    description: "Source primaire de la donnée."
    default: "joydiv.org"

  titres:
    type: list
    items: string
    description: >
      Liste des titres enregistrés lors de la session, dans l'ordre
      documenté quand disponible. Utiliser de préférence les
      identifiants canoniques chansons du REGISTRY.
    default: []

  premiere_sortie_officielle:
    type: object
    description: >
      Description de la première publication officielle des
      enregistrements (titre, format, label, année). {} si jamais
      publié officiellement.
    fields:
      titre: "Nom de la sortie (album, single, EP, compilation)"
      format: "album | single | EP | compilation | BBC release | inédit"
      label: "Label éditeur"
      annee: "Année de sortie (YYYY)"
    default: {}

  atomes_lies:
    type: list
    items: string
    description: >
      Identifiants des atomes documentaires qui mentionnent cette
      session.
    default: []

  chronologie_id:
    type: string
    description: >
      Identifiant de l'entrée correspondante dans
      registers/chronology/master_chronology.md (ex. CHR-1978-001).
    example: "CHR-1978-001"

  ingenieur_son:
    type: string
    description: "Ingénieur du son si documenté."
    example: "Jon Caffery"

  statut_session:
    type: string
    description: "Statut de publication des enregistrements."
    controlled_values:
      - officiel
      - inedit
      - bootleg
      - perdu
      - partiel

  notes:
    type: string
    description: >
      Informations complémentaires : plage de dates, contexte,
      remixes ultérieurs, contradictions de sources.
    default: ""

# ─── Règles éditoriales ────────────────────────────────────────────

rules:
  - numero unique et croissant dans la chronologie canonique
  - date ISO 8601 (YYYY-MM-00 si jour inconnu)
  - producteur "Inconnu" si non documenté, jamais omis
  - titres [] si inconnus
  - premiere_sortie_officielle {} si jamais publié officiellement
  - ere obligatoire (Warsaw pour les sessions de 1977 jusqu'à
    An Ideal for Living incluse, Joy Division à partir de mai 1978)

warnings:
  - ne pas confondre date de session et date de diffusion / sortie
  - ne pas inventer de tracklist
  - une plage de dates (ex. 18-30 mars 1980) reste une seule session
