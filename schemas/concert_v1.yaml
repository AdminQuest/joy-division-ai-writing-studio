schema: concert
version: 1.0

description: >
  Schéma documentaire des concerts Joy Division (et Warsaw / Stiff Kittens).
  Chaque entrée représente un concert (ou un passage TV en public) identifiable,
  daté, localisé. Source canonique primaire : joydiv.org (Tony Nuttall).
  Régit registers/concerts/00_canonical_concerts.md.

required:
  - id
  - date
  - statut
  - lieu
  - ville
  - pays
  - ere
  - source

recommended:
  - url_detail
  - atomes_lies
  - notes
  - chronologie_id

optional:
  - nom_tournee
  - setlist

# ─── Détail des champs ──────────────────────────────────────────────

fields:

  id:
    type: string
    pattern: "JD-CONCERT-YYYYMMDD-NNN"
    description: >
      Identifiant canonique unique. Format : JD-CONCERT-YYYYMMDD-NNN
      où NNN est un index sur 3 chiffres (001, 002…) pour les doublons
      de même date. Jour inconnu : utiliser 00 pour le jour
      (ex. JD-CONCERT-19771200-001 pour décembre 1977 jour inconnu).
    example: "JD-CONCERT-19770529-001"

  date:
    type: string
    format: "YYYY-MM-DD"
    description: >
      Date ISO 8601. Si jour inconnu, utiliser YYYY-MM-00.
    example: "1977-05-29"

  statut:
    type: string
    description: "Statut du concert."
    controlled_values:
      - confirme
      - annule
      - reporte
      - douteux
      - tv
    notes: >
      - confirme : concert réellement joué, attesté
      - annule : programmé puis annulé (à conserver dans le registre)
      - reporte : reprogrammé à une autre date (utiliser notes pour signaler)
      - douteux : date ou existence contestée (signaler dans notes)
      - tv : captation TV en public ou en studio (Granada Reports,
        Something Else, What's On…)

  lieu:
    type: string
    description: "Nom canonique de la salle ou du studio TV."
    example: "Electric Circus"

  ville:
    type: string
    example: "Manchester"

  pays:
    type: string
    description: >
      Pays au format court (UK, FRANCE, BELGIQUE, PAYS-BAS, ALLEMAGNE,
      USA, CANADA, IRLANDE).
    example: "UK"

  ere:
    type: string
    description: "Nom sous lequel le groupe se produisait à cette date."
    controlled_values:
      - "Warsaw"
      - "Stiff Kittens"
      - "Joy Division"

  source:
    type: string
    description: "Source primaire de la donnée."
    default: "joydiv.org"

  url_detail:
    type: string
    description: >
      URL de la fiche détaillée sur joydiv.org quand disponible.
    example: "https://joydiv.org/c290577.htm"

  atomes_lies:
    type: list
    items: string
    description: >
      Identifiants des atomes documentaires (ex. S41-A012) qui
      mentionnent ce concert.
    default: []

  chronologie_id:
    type: string
    description: >
      Identifiant de l'entrée correspondante dans
      registers/chronology/master_chronology.md (ex. CHR-1980-001).
    example: "CHR-1980-001"

  notes:
    type: string
    description: >
      Informations complémentaires : reprogrammation, contradictions de
      sources, première partie, contexte (Buzzcocks tour…), état de
      Ian Curtis, festival, etc.
    default: ""

  nom_tournee:
    type: string
    description: "Nom de la tournée si applicable."
    example: "Buzzcocks tour"

  setlist:
    type: list
    items: string
    description: "Setlist quand documentée. [] sinon."
    default: []

# ─── Règles éditoriales ────────────────────────────────────────────

rules:
  - un id unique par concert (même date = suffixe 001, 002…)
  - date toujours en ISO 8601 (YYYY-MM-00 si jour inconnu)
  - statut obligatoire ; les concerts annulés gardent leur entrée
    avec statut: annule
  - ere obligatoire : Warsaw (mai-déc 1977), Stiff Kittens (29 mai 1977
    seulement), Joy Division (à partir de janv. 1978)
  - source toujours renseigné (par défaut : joydiv.org)
  - setlist [] si inconnue

warnings:
  - ne pas inventer de setlist
  - ne pas fusionner deux concerts distincts en une seule entrée
  - signaler toute contradiction de date entre sources dans notes
