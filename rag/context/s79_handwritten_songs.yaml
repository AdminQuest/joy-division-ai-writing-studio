verification_rules:
  - "Ne jamais reproduire les paroles complètes des chansons depuis cette section."
  - "Les fac-similés sont des images : l'extraction textuelle (pdftotext) n'en capte pas le contenu manuscrit."
  - "Les observations visuelles sur les fac-similés (ratures, annotations) sont à statut a_verifier. Vérifier sur l'original."
  - "Les datations viennent des légendes des versions typographiées — source éditée, pas les manuscrits eux-mêmes."
  - "Transmission est daté 1978 dans S79 (non 1979)."
  - "Interzone est daté 1978 dans S79."
  - "Passover figurait dans la liste des titres alternatifs d'Unknown Pleasures (A091)."
writing_use: >
  Utiliser ce contexte pour : la datation des chansons dans S79 (source éditée 2014) ;
  les observations de génétique textuelle (ratures, titres barrés, annotations) pour
  Disorder, Candidate, New Dawn Fades, Transmission, Atmosphere, From Safety to Where...? ;
  la cartographie de l'ensemble du corpus de Curtis par album et par période ;
  la présence des fac-similés comme matérialisation des archives primaires dans le volume S79.
