writing_use: >
  Utiliser S63 pour :
  (1) Chapitre 2 — épisode RCA de Joy Division (Curtis à la MSC 1977, Brandwood,
  An Ideal for Living, enregistrements avortés) ; Lust for Life comme chef-d'œuvre
  méconnu/culte (note 7) ; Sumner et la conception fonctionnelle du rôle de chanteur ;
  (2) Chapitre 3 — philosophie fondatrice de Factory Records (no-contract contract,
  Gretton motivation pragmatique / droits d'édition, Wilson comme figure ambivalente ;
  Joy Division comme méthode de production prédéterminée) ;
  (3) Chapitre 4 — influences de Curtis : Lust for Life / Kramer sur le statut mythique
  de l'artiste qui transcende l'esthétique ;
  (4) Chapitre 12 — mythe Factory dans la longue durée (Wilson auto-mythologisation /
  audience historique anticipée ; Corbijn vs Winterbottom) ;
  (5) Chapitre 14 — mythologisation via le cinéma (24 Hour Party People vs Control),
  infrathin et culture matérielle du disque, authenticité comme piège.
verification_rules:
  - "La scène du contrat au sang est filmique — aucun témoin direct ne la confirme."
  - "Le vrai contrat fut établi entre Wilson et Gretton 'on dinner napkins' (Middles 2002)."
  - "Note 13 : Joy Division possédait son catalogue grâce à l'absence de contrat formel."
  - "Les données sur l'épisode RCA (Brandwood, Anderson) viennent de sources secondaires — croiser avec S41 et S45."
  - "Citation Hook (2013a, 119) transmise par S63 — vérifier dans S41 directement."
  - "La mort de Wilson (cancer, médicaments onéreux) est documentée mais ses mots exacts passent par Nice (2010)."
  - "Sumner 'singer's job' : analyse linguistique de S63, non déclaration explicite de Sumner — croiser avec S42."
  - "Lust for Life comme influence centrale JD : affirmation de S63 — corroborer avec S79 et S41."
  - "Citation Gretton (Middles 2002, 108) : 3 niveaux de filtrage — à utiliser avec attribution explicite."
