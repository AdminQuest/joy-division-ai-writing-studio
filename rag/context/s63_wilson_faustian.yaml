  scope: >
    Chapitre 2 de Heart and Soul (2018), intégralement atomisé.
    Analyse de la scène du contrat au sang dans 24 Hour Party People (Winterbottom, 2002)
    comme pacte faustien inversé. Couvre : mythologisation de Factory Records, archétype
    faustien appliqué à Wilson, double conscience de Curtis / épisode RCA (1977),
    concept duchampien de l'infrathin appliqué à l'objet disque, paradigme de
    l'authenticité punk (Williams, Hebdige), débâcle RCA, philosophie du no-contract
    contract et mort de Wilson.
