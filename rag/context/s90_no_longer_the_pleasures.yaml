themes_principaux:
  - "Hauntologie : Joy Division capte « notre présent, leur futur » — 1979-80 comme seuil historique (fordisme → néolibéralisme)"
  - "Ontologie dépressive : mélancolie sans objet-cause, passage du « bleu » de la tristesse au « noir » de la dépression"
  - "Joy Division comme groupe le plus schopenhauerien — « anti-rock », au-delà du principe de plaisir"
  - "Voix de Curtis comme « déjà mort », fatalisme, vie comme film pré-écrit"
  - "Trois films (24 Hour Party People, Control, doc. Grant Gee) — Control comme « karaoké arthouse » vs Gee comme objet hauntologique"
  - "« She's Lost Control » : épilepsie comme unheimlich (Freud), attrait minéral de l'inanimé"
  - "Hannett + Saville : « plus Art que Rock », « consistance conceptuelle », Warsaw → cyberpunks"
  - "Rapport occulté au Black Atlantic — dub comme méthodologie, « Death Disco », syn-drums d'« Insight »"
  - "Le culte JD comme affaire de garçons — exclusion des femmes (Deborah Curtis)"
  - "Le suicide comme garantie d'authenticité (« 4 Real »), transfiguration en mythe froid (marbre/pierre, Saville, « In a Lonely Place »)"
  - "Les « deux Joy Division » (Pure Art vs « just a laff ») — JD comme « vérité du Laddism »"
  - "Angleterre 1979 : « speed comedown » culturel ; destruction de la communauté ouvrière (Sumner via Savage), « the void »"

