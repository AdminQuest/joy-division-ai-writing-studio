auteur: "Mark Fisher"
titre: "Ghosts of My Life: Writings on Depression, Hauntology and Lost Futures"
chapitre_atomise: "No Longer the Pleasures: Joy Division (01: The Return of the 70s)"
origine_chapitre: "adapté d'un billet k-punk, 9 janvier 2005"
editeur: "Zero Books"
