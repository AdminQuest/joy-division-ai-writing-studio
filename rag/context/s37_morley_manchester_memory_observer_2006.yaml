writing_use: >
  Utiliser ce passage pour penser Manchester comme ville musicale historicisée, la prudence causale entre pop culture
  et régénération urbaine, Factory comme producteur d’une fiction Manchester, Morley comme théoricien de la mémoire
  par versions multiples, et le passé actif de Joy Division comme ressort de son éternel retour culturel.
verification_rules:
  - "Ne pas utiliser Morley comme source unique sur la régénération urbaine de Manchester."
  - "Ne pas déduire la transformation matérielle de Manchester des pochettes de Saville ou de Factory."
  - "Qualifier la mémoire morleyenne comme montage de souvenirs, suppositions et langage."
  - "Conserver la distinction entre pluralité des versions et relativisme factuel."
  - "Utiliser les citations uniquement comme extraits courts vérifiés."
