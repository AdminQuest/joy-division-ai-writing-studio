  - "Distinguer influence attestée, écho lexical, proximité thématique, analogie structurale et hypothèse critique."
  - "Ne pas transformer les temporalités suspendues en prémonition morbide."
  - "Croiser Plan K avec S41, S45, S76, Savage et les archives disponibles."
  - "Ne pas faire de Burroughs et Ballard les causes uniques de l’écriture de Curtis."
