writing_use: >
  Utiliser ce passage pour documenter la scène mancunienne en juillet 1977 : Manchester comme périphérie rock
  en voie d’autonomisation, Devoto et Buzzcocks comme catalyseurs, les lieux comme réseau, les fanzines et labels
  comme supports d’auto-organisation, Warsaw comme groupe encore non singularisé, et la préfiguration d’une
  « central factory » avant Factory Records.
verification_rules:
  - "Distinguer l’article NME contemporain du cadrage rétrospectif de Piece by Piece."
  - "Ne pas faire de Morley une source socio-économique principale sur Manchester."
  - "Croiser les concerts Sex Pistols, Spiral Scratch, lieux et labels avec les chronologies spécialisées."
  - "Ne pas présenter Warsaw comme déjà central en juillet 1977."
  - "Employer les citations directes uniquement sous forme brève et vérifiée."
