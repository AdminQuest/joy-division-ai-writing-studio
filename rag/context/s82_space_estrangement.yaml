avertissements:
  - "L'approche est esthétique et théorique (Brecht, Shklovsky) — cadre analytique à déclarer, non partagé par les acteurs eux-mêmes."
  - "'Espace' ici est une métaphore analytique sonore et phénoménologique, pas un espace géographique (Manchester)."
  - "La psychogéographie est utilisée comme foil — ne pas lire ce chapitre comme une réfutation mais comme un déplacement d'angle analytique."
  - "Note 10 : les masters des sessions Cargo Studios n'ont pas survécu — l'analyse des premières sessions repose sur l'expérience d'écoute de l'auteur."
  - "van de Kamp 1981 cité mais non référencé dans la bibliographie du chapitre — prudence sur cette citation."
  - "À articuler avec S83 (Greenwood & Tarpey) qui traite également de Hannett et de l'architecture sonore."
