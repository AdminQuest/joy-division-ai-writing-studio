description: >
  Analyse de la présentation de Joy Division en 1978-1979 comme aesthetics of
  estrangement — rupture délibérée avec les conventions de genre (authenticité
  punk, réplication du live, identification listener-performer). Trois sessions
  couvertes : Cargo Studios octobre 1978 (Digital, Glass / A Factory Sample),
  Strawberry Studios avril 1979 (Unknown Pleasures), Strawberry Studios juillet
  1979 (Transmission single). Trois registres analysés : production sonore
  non-indexicale de Hannett (delay, reverb, DMX 15-80 S, son "completely dead"),
  espace visuel hermétique de Saville (CP1919, absence de marqueurs identifiants),
  paroles de Curtis sans ancrage spatio-temporel (espace métaphorique de projection).
  Cadres théoriques : Moylan (sound stage, deux axes), Eisenberg (studio = ideal event),
  Lefebvre (espace social), Frith (genre et authenticité). Contre-argument explicite
  à la lecture psychogéographique de Manchester.

