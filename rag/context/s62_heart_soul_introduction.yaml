writing_use: >
  Utiliser S62 pour :
  (1) Chapitre 2 — données factuelles consensuelles sur la formation du groupe (Salford, 43 chansons,
  120 concerts, première sous le nom JD en janvier 1978) ;
  (2) Chapitre 3 — philosophie de Hannett (espace/absence) comme cadrage analytique ;
  (3) Chapitre 13 — premier concert de New Order (30 juillet 1980) et gallows humour de Sumner ;
  (4) Chapitre 14 — institutionnalisation académique de Joy Division (symposium Limerick 2015),
  True Faith exhibition (MIF 2017), formule 'touching from a distance', posture fan/chercheur.
verification_rules:
  - "Les données biographiques (43 chansons, 120 concerts) sont issues de sources secondaires — croiser avec S41, S35."
  - "La formule 'art is sometimes found in the absence' est des éditeurs, non de Hannett."
  - "La posture fan/chercheur est déclarée et réflexive — ne pas l'utiliser pour relativiser les analyses."
  - "'Touching from a distance' : double intertexte (Deborah Curtis / Valdés Miyares) — préciser selon le contexte d'usage."
  - "True Faith (MIF 2017) et So It Goes ∑(No,12k,Lg,17Mif) sont deux événements distincts du même festival."
note_structure: >
  L'ouvrage Heart and Soul est atomisé chapitre par chapitre. S62 est l'introduction.
  Les autres chapitres : S29 (Ch.1/Goddard), S63–S67 (Ch.2–6), S80–S88 (Ch.7–15).
