  scope: >
    Introduction éditoriale de l'ouvrage collectif Heart and Soul: Critical Essays on Joy Division (2018).
    Couvre : données factuelles consensuelles sur Joy Division, premier concert de New Order (30 juillet 1980),
    philosophie de Hannett (espace/absence), True Faith exhibition (MIF 2017), symposium Atrocity Exhibition
    (Limerick 2015), structure thématique du volume en six parties, posture épistémologique fan/chercheur,
    formule conclusive 'touching from a distance'.
