writing_use: >
  Utiliser S53 comme source secondaire critique pour penser l’incarnation mythique de Joy Division par les images,
  les symboles, le genius loci de Manchester, l’esthétique dark, la poppizzazione, l’anthropologie de la nostalgie pop,
  l’affectologie sociale, le totem Curtis et le fantôme médiatique Joy Division.
verification_rules:
  - "Ne pas utiliser S53 comme source primaire sur l’histoire factuelle de Joy Division."
  - "Croiser Unknown Pleasures avec S48, S50, S09, Saville et les notices discographiques."
  - "Croiser Kevin Cummins et Epping Walk Bridge avec les sources photographiques."
  - "Croiser Control avec S52 et les fiches filmographiques."
  - "Croiser le corps gestuel de Curtis avec S49 et S52 ; ne pas le réduire à une lecture clinique."
  - "Distinguer analyse du mythe et adhésion au mythe."
