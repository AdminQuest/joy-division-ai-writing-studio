writing_use: >
  Utiliser S50 comme source secondaire critique pour penser la réinvention audiovisuelle contemporaine de l’imaginaire Joy Division,
  notamment Unknown Pleasures Reimagined, les écosystèmes médiatiques, les pratiques fan, les memes, YouTube,
  la traduction intersémiotique et les limites de la patrimonialisation.
verification_rules:
  - "Ne pas utiliser S50 comme source primaire sur la période 1979-1980."
  - "Vérifier les crédits, dates, vidéos et liens web avant toute rédaction finale."
  - "Croiser Saville/Cummins/Corbijn avec S48, S09 et les registres visuels."
  - "Croiser les performances de Curtis avec S49, S41, S45 et les registres audiovisuels."
  - "Ne pas présenter la réception YouTube comme représentative de toute la réception."
