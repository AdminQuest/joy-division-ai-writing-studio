writing_use: >
  Utiliser S49 comme source secondaire critique pour lire Ian Curtis à travers le corps scénique, la danse existentielle,
  la masculinité post-punk, la mélancolie masculine et les risques de romantisation. Ne pas utiliser S49 comme source
  primaire sur les faits médicaux, les dates de concert, les crédits discographiques ou les paroles.
verification_rules:
