writing_use: >
  Utiliser S52 comme source secondaire critique pour penser Control d’Anton Corbijn, la surface biographique,
  la métaphore du verre, la réduction filmique de Curtis, la dualité curtisienne, la tension personnage/vrai soi,
  l’epilepsy dance pré-diagnostic et la non-monocausalité de la maladie, de l’amour et du suicide.
verification_rules:
  - "Ne pas utiliser S52 comme source primaire sur la vie de Curtis."
  - "Vérifier dans S45 Deborah Curtis toutes les citations et anecdotes rapportées par Rabbito."
  - "Vérifier dans S10, S41, S76 et Savage les témoignages de Sumner, Hook, Morris et Wilson."
  - "Ne pas transformer la formule de Tony Wilson sur l’héros romantique en explication du suicide."
  - "Ne pas réduire l’epilepsy dance à un symptôme médical ; croiser S49 et les sources santé."
  - "Distinguer critique de Control, analyse du biopic et vérité biographique."
