coverage:
  passage: "Chapitre 3 — p. 33–46"
  pdf_pages: "64–77"
  scope: >
    Chapitre 3 de Heart and Soul (2018), intégralement atomisé.
    Couvre : cadrage post-Brexit et article de Sumner (The New European) ;
    lectures européennes de Curtis (Dostoevsky, Nietzsche, Sartre, Hesse, Ballard,
    Heartfield) ; esthétisation postwar du nazisme dans le rock britannique (Hebdige,
    signifiant vide) ; nom Warsaw / nom Joy Division / An Ideal for Living / Hess /
    abandon de l'imagerie nazie par Gretton ; kraut-rock comme imaginaire postnational
    (Kraftwerk, Can, Neu!, Bowie, Morris/Trans-Europe Express) ; Plan K, Bruxelles
    (16 octobre 1979, premier concert hors UK, Annik Honoré, photos Carly) ;
    Les Bains Douches Paris (18 décembre 1979) ; tournée européenne janvier 1980 ;
    critique Spex n°1 (Bömmels 1980) ; conclusion : Joy Division comme Gesamtkunstwerk
    cosmopolite.
