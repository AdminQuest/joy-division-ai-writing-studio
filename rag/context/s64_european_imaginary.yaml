writing_use: >
  Utiliser S64 pour :
  (1) Chapitre 2 — nom Warsaw (Bowie/'Warszawa'), nom Joy Division (House of Dolls),
  An Ideal for Living cover (Hitlerjugend/Sumner Albrecht), Hess, abandon par Gretton ;
  (2) Chapitre 3 — lectures de Curtis, kraut-rock (Kraftwerk/Can/Neu!), Plan K
  comme contexte Factory/Europe, Morris jouant Trans-Europe Express en pre-show ;
  (3) Chapitre 4 — lectures littéraires européennes de Curtis (Dostoevsky, Nietzsche,
  Sartre, Hesse, Ballard) comme substrat de la poésie de l'aliénation ;
  (4) Chapitre 5 — imagerie visuelle An Ideal for Living (Saville/Sumner Albrecht,
  typographie gothique, photo ghetto Varsovie) ;
  (5) Chapitre 14 — réception européenne (Plan K, Bains Douches, Spex), Gesamtkunstwerk
  cosmopolite comme formule d'héritage, Brexit comme révélateur de la dimension européenne.
verification_rules:
  - "L'attribution du nom 'Joy Division' à Ian ou Bernard : comptes rendus divergents — ne pas trancher sans source primaire directe."
  - "La couverture An Ideal for Living : 'Albrecht' est le nom germanisé de Sumner, temporairement adopté."
  - "L'épisode Burroughs au Plan K est une légende — plusieurs versions, non établie."
  - "La critique Spex est traduite de l'allemand par Bottà — non vérifiable sans l'original."
  - "Annik Honoré au Plan K : confirmé dans S45 ; S64 donne le contexte institutionnel (Crépuscule/Factory Benelux)."
  - "Note 4 de S64 : l'auteur de House of Dolls (Ka-Tzetnik 135633) est Yehiel Feiner, dit De-Nur."
note_structure: >
  S64 est le chapitre 3 de Heart and Soul. Introduction = S62. Ch.1 = S29. Ch.2 = S63.
  Ch.4 = S65. Ch.5 = S66. Ch.6 = S67. Ch.7–15 = S80–S88.
