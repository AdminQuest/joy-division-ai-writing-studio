  - "Croiser Stiff Kittens, Warsaw, Electric Circus et première review avec S41, S45, S46 et S76."
  - "Ne pas transformer le suicide du père de Morley en explication de Joy Division ; l’utiliser seulement pour qualifier le régime d’écriture de Morley."
