description: >
  Analyse clinique multidisciplinaire du suicide de Ian Curtis par autopsie
  psychologique (PA, méthode Shneidman) et échelle SADPERSONS. Démontre que
  Curtis présentait un MDD sévère (DSM-5) et une épilepsie pharmacorésistante
  avec effets dépressogènes des AED — interaction à risque suicidaire 32 fois
  supérieur à la population générale (Christensen 2007). Thèse centrale :
  le suicide de Curtis n'était pas inévitable. Critique de la romanticisation
  du "tortured artist" et des carences des services médicaux de 1980.
  Source unique dans la littérature Joy Division par sa démarche médicale
  rigoureuse.

