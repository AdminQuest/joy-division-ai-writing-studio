writing_use: >
  Utiliser ce passage pour l'écosystème culturel manchestérien des années 1970 (librairies,
  paperback culture), la formation autodidacte de Curtis via Burroughs, l'origine du nom
  Joy Division (House of Dolls), la chronologie LWTUA, la tension fiction/autobiographie
  dans les paroles, et le rôle de Curtis comme directeur aux répétitions.
verification_rules:
