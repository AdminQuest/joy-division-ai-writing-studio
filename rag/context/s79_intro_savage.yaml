writing_use: >
  Utiliser ce passage pour : l'écosystème culturel manchestérien des années 1970
  (librairies, paperback culture) ; la formation autodidacte de Curtis via Burroughs ;
  l'origine du nom Joy Division (House of Dolls) ; la chronologie LWTUA ;
  la tension fiction/autobiographie dans les paroles ; le rôle de Curtis comme directeur
  aux répétitions ; la politique de rétention Gretton sur les paroles (automne 1979) ;
  l'aveuglement collectif de l'entourage documenté par Hook et Morris ; la confrontation
  Deborah/Curtis sur New Dawn Fades ; la genèse de The Eternal (enfant trisomique,
  Macclesfield, Sumner) ; l'origine berlinoise de Komakino ; les sessions Britannia Row
  et le témoignage du tourbillon (Sumner) ; la thèse finale de Savage sur la connexion
  humaine et la jeunesse néo-libérale ; la note manuscrite « Reality is only a term ».
verification_rules:
  - "Butterworth et Morris sont cités indirectement via Savage."
  - "Dates LWTUA à vérifier contre S35 (Morris) et S41 (Hook)."
  - "Ne pas réduire le nom Joy Division à un positionnement idéologique."
  - "Distinguer Ian Curtis auteur et Jon Savage éditeur-critique."
  - "Genèse de The Eternal (S79-A083) : source indirecte — Sumner rapporte à Savage ce que Curtis lui a dit."
  - "Témoignage Britannia Row (S79-A085) : source indirecte (Sumner → Savage). Croiser avec S35."
  - "Ne pas reproduire les paroles complètes des chansons depuis ce passage."
  - "La note manuscrite (S79-A087) est une trace, pas une clé d'interprétation fermée."
