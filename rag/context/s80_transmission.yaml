description: >
  Analyse linguistique et communicationnelle de Joy Division et de « Transmission »
  à travers le métamodèle constitutif de la communication de Robert T. Craig (1999),
  décliné en sept traditions théoriques. Examine l'inarticulacy comme stratégie
  expressive, la production de Hannett comme conversion du pheno-song en geno-song
  (Barthes), la politique d'anti-image, la transformation illocutoire des paroles
  après la mort de Curtis, et l'héritage filmic et numérique de Joy Division.
  Source-pivot pour les chapitres 4, 6 et 14.

