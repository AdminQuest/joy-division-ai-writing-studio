writing_use: >
  Utiliser S78 pour traiter Joy Division / Manchester comme construction d’écoute, de médiation et de patrimoine,
  et non comme essence sonore : indexicalité, entrepreneurs d’interprétation, images, films, régénération urbaine,
  écoute mobile et réification du lieu.
verification_rules:
