auteur: "Sara Martínez"
titre_article: "Literary Influences on Joy Division: J. G. Ballard, Franz Kafka, Dostoevsky"
titre_ouvrage: "Heart and Soul: Critical Essays on Joy Division"
annee: "2018"
pagination: "p. 47–62"
statut: atomisee
date_atomisation: 2026-05-26

description: >
  Analyse des influences littéraires directement attestées sur Joy Division et les paroles de Ian
  Curtis. Martínez construit une trilogie analytique : trois chansons (The Kill, Colony, Atrocity
  Exhibition) mises en parallèle avec trois textes (Dostoevsky, Kafka, Ballard). Quatre motifs
  transversaux : pouvoir, contrôle, trauma, dislocation psychologique. Thèse centrale : la lecture
  était pour Curtis un vecteur de catharsis, non une contrainte — l'authenticité devient
  "fictionnalisée". Le chapitre conclut sur l'héritage post-punk de Joy Division, Manchester
  comme marqueur d'authenticité, l'anti-image, et l'exposition True Faith (2017).

