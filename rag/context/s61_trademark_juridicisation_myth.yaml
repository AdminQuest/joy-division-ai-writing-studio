summary: >
  S61 fournit la couche juridique du mythe Joy Division. Le chapitre examine le nom du groupe comme marque, les titulaires des marques Joy Division, les marques New Order, le conflit Hook / New Order, les critères de continuité d’un groupe après scission, la protection des consommateurs et la limite juridique de la protection du style ou du son.
recommended_use: >
  Utiliser S61 pour écrire la patrimonialisation juridique et marchande de Joy Division, non pour prouver directement les faits de registre sans vérification primaire.
