writing_use: >
  Utiliser ces atomes pour :
  (1) Chapitre 2 — trajectoire critique Warsaw → Joy Division (A039-A044) ;
  (2) Chapitre 5 — réception et genèse Unknown Pleasures, idée de la pochette par Sumner (A052, A070, A074) ;
  (3) Chapitres 6-7-9-10 — analyse des chansons via les sleeve notes Palatine et les recensions NME (A054, A058, A065) ;
  (4) Chapitre 13 — écosystème Factory/ZTT, New Order, 24HPP, Control (A063, A069, A073, A075-A077) ;
  (5) Chapitre 14 — Morley comme constructeur de mythe, réflexivité critique, relation Morley-Wilson-Curtis (A028, A052, A064, A067, A071, A072, A078).
verification_rules:
  - "Distinguer rigoureusement les textes NME contemporains (1977-1981) des rétrospections de Morley (1984-2008)."
  - "Ne pas traiter Morley comme source factuelle souveraine pour dates, lieux ou responsabilités collectives."
  - "Bernard Sumner comme auteur de l'idée de la pochette d'UP : croiser avec témoignages de Sumner (S41) et Saville."
  - "La dernière rencontre Hook-Curtis (joie) : croiser avec témoignages de Hook (S41) et autres sources."
  - "Les superlatives Palatine ('greatest song ever written') : stylistiques, pas analytiques — utiliser pour documenter la rhétorique de Morley."
  - "La mort de Wilson pendant l'écriture : ne pas sur-dramatiser — utiliser pour qualifier le statut du livre."
  - "Lien père-Morley/Curtis : déclarer méthodologiquement sans réduire la valeur analytique des textes."
