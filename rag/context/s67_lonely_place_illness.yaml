note_methodologique: >
  Naiman mobilise les vocal studies (Sterne, Kriedman & Sidtis, Dyson),
  la disability studies (Butler) et les cultural studies pour produire
  une lecture de la voix de Curtis qui évite à la fois la romantisation
  du génie maudit et le réductionnisme clinique. L'ill style est une
  métaphore analytique à employer avec précision, non un terme généralisant.

prudences:
