source_id: S66
source_label: "S66 — Schütte, On Ian Curtis's Lyrics, 2018"
auteur: "Uwe Schütte"
titre_article: "'Possessed by a Fury That Burns from Inside': On Ian Curtis's Lyrics"
titre_ouvrage: "Heart and Soul: Critical Essays on Joy Division"
annee: "2018"
pagination: "p. 63–80"
statut: atomisee
date_atomisation: 2026-05-26

description: >
  Analyse des paroles de Ian Curtis comme corpus littéraire autonome depuis une perspective
  philologique et littéraire (Schütte est germaniste, spécialiste de Sebald et du post-punk).
  Chapitres thématiques : (1) Portrait du jeune poète ouvrier / contexte générationnel ;
  (2) Manchester comme paysage intérieur — genius loci, généalogie cachée Sebald/Butor ;
  (3) House of Dolls et 'No Love Lost' — Stalag literature, Sprechgesang, décontextualisation ;
  (4) An Ideal for Living et la fascination nazie — dialectique punk/fascisme, Fournier ;
  (5) Stratégie lyrique d'ouverture à l'interprétation — 'The Eternal', 'Dead Souls'/Gogol ;
  (6) 'Atrocity Exhibition' (Ballard titre ≠ contenu ; Dante, House of Dolls) et 'Colony'
  (Crockett : performance foucaldienne, analogie sonore vinyle/aiguilles) ;
  (7) Conclusions — Gesamtkunstwerk littéraire, Artaud comme piste, prudence biographique.

